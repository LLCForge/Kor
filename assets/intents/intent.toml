# Kor intent catalog: maps free text (tr/en/fr) to `kor` CLI commands.
#
# One [[intent]] per command. Fields:
#   command  exact `cli` string from parity.toml (plus intent/tool commands not yet in it)
#   run      "auto"    = local, read-only, no model/network/money: may run without asking
#            "confirm" = writes, runs, installs, calls a model or the network: ask first
#            "never"   = entry point that free text must never route to (phrases empty)
#   tr/en/fr example phrases; the matcher normalizes them (lowercase, Turkish letters
#            folded, apostrophes dropped, suffix prefix-matching, stopwords removed)
#   params   optional arguments: { name, kind = path|text|number|url|domain, required, flag? }
#            `flag` is set when the value is passed as `--flag value` instead of positionally
#   tokens   rough total LLM tokens of one run (only for commands that call a model)
#   eta_s    rough seconds one run takes

[[intent]]
command = "kor"
run = "never"
tr = []
en = []
fr = []
eta_s = 1

[[intent]]
command = "kor resume"
run = "confirm"
tr = ["son oturumu sürdür", "önceki oturuma devam et", "kaldığım oturumdan devam", "eski konuşmayı sürdür"]
