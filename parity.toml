# CLI ↔ TUI ↔ masaüstü parite manifestosu (Master Build Prompt §2 kural 9).
#
# Her özellik üç yüzeyde de olmalı. "-" = o yüzeyde henüz yok (açık borç).
# `cli`: komut yolu ("kor config set"); `tui`: etkileşimli ekrandaki karşılığı (slash komutu);
# `desktop`: köprü yöntemi (`window.kor.<yol>`).
#
# CI denetimi (`cargo test -p kor-cli parity`):
#   1. CLI'daki her alt komut burada bir özelliğin `cli` değeri olarak geçmeli (yeni komut eklenip
#      manifest unutulursa test kırmızı).
#   2. "-" sayısı `allowed_gaps`'i aşamaz. Bir boşluk kapatıldığında sayıyı düşürün; artırmak yasak.
#   `internal = true`: kullanıcı özelliği değil, başka bir programın çağırdığı uç (denetim dışı).

[meta]
allowed_gaps = 1

