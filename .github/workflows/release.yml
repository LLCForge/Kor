# SPDX-License-Identifier: Apache-2.0 OR MIT
# Release: cargo-dist (generated, then adapted: workspace in backend/, signed raw binaries
# for `kor update`). Secrets/vars: MINISIGN_SECRET_KEY (secret, `minisign -G -W`),
# KOR_UPDATE_PUBKEY (variable, the public key line).
#
# Desktop installers (job `desktop`, ADR 0032): Tauri msi+nsis / universal app+dmg / deb+rpm+AppImage,
# each with the `kor` CLI as a sidecar. Every secret is optional: a missing one gives an unsigned
# (clearly renamed `_UNSIGNED`) artifact and the release is still published with a warning. Set the
# repository variable KOR_REQUIRE_SIGNED=true to refuse publishing unsigned installers instead (then
# re-run on the tag with allow-unsigned to override once). Names:
#   Windows (Azure Trusted Signing): secrets AZURE_TENANT_ID, AZURE_CLIENT_ID, AZURE_CLIENT_SECRET;
#     variables AZURE_SIGNING_ENDPOINT, AZURE_SIGNING_ACCOUNT, AZURE_SIGNING_PROFILE
#   macOS (Developer ID + notarization): secrets APPLE_CERTIFICATE (base64 .p12), APPLE_CERTIFICATE_PASSWORD,
#     APPLE_SIGNING_IDENTITY, APPLE_ID, APPLE_PASSWORD (app-specific), APPLE_TEAM_ID
#   Linux (detached GPG .asc): secrets GPG_PRIVATE_KEY (armored), GPG_PASSPHRASE
#   Tauri updater: secrets TAURI_SIGNING_PRIVATE_KEY, TAURI_SIGNING_PRIVATE_KEY_PASSWORD; variable
#     TAURI_UPDATER_PUBKEY (the matching public key; compiled into the app)
# This file was autogenerated by dist: https://axodotdev.github.io/cargo-dist
#
# Copyright 2022-2024, axodotdev
# SPDX-License-Identifier: MIT or Apache-2.0
#
# CI that:
#
# * checks for a Git Tag that looks like a release
# * builds artifacts with dist (archives, installers, hashes)
# * uploads those artifacts to temporary workflow zip
# * on success, uploads the artifacts to a GitHub Release
#
# Note that the GitHub Release will be created with a generated
# title/body based on your changelogs.

name: Release
permissions:
  "contents": "write"

defaults:
  run:
    working-directory: backend

# This task will run whenever you push a git tag that looks like a version
# like "1.0.0", "v0.1.0-prerelease.1", "my-app/0.1.0", "releases/v1.0.0", etc.
# Various formats will be parsed into a VERSION and an optional PACKAGE_NAME, where
# PACKAGE_NAME must be the name of a Cargo package in your workspace, and VERSION
# must be a Cargo-style SemVer Version (must have at least major.minor.patch).
#
# If PACKAGE_NAME is specified, then the announcement will be for that
# package (erroring out if it doesn't have the given version or isn't dist-able).
#
# If PACKAGE_NAME isn't specified, then the announcement will be for all
# (dist-able) packages in the workspace with that version (this mode is
# intended for workspaces with only one dist-able package, or with all dist-able
# packages versioned/released in lockstep).
#
# If you push multiple tags at once, separate instances of this workflow will
# spin up, creating an independent announcement for each one. However, GitHub
# will hard limit this to 3 tags per commit, as it will assume more tags is a
# mistake.
#
# If there's a prerelease-style suffix to the version, then the release(s)
# will be marked as a prerelease.
on:
  pull_request:
  # Re-run a release on an existing tag (choose the tag as the ref), e.g. to publish unsigned desktop builds.
  workflow_dispatch:
    inputs:
      allow-unsigned:
        description: Publish desktop installers even if they are not OS-signed
        type: boolean
        default: false
  push:
    tags:
      - '**[0-9]+.[0-9]+.[0-9]+*'

env:
  # rustc needs more stack than the default for the fat-LTO link of the CLI (SIGBUS/SIGSEGV otherwise).
  RUST_MIN_STACK: "268435456"

jobs:
  # Run 'dist plan' (or host) to determine what tasks we need to do
  plan:
    runs-on: "ubuntu-22.04"
    outputs:
      val: ${{ steps.plan.outputs.manifest }}
      tag: ${{ !github.event.pull_request && github.ref_name || '' }}
      tag-flag: ${{ !github.event.pull_request && format('--tag={0}', github.ref_name) || '' }}
      publishing: ${{ !github.event.pull_request }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: recursive
      # ubuntu-22.04's python3 is 3.10; the release helpers need 3.11+ (tomllib).
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Manual runs must start from a tag
        if: ${{ github.event_name == 'workflow_dispatch' && !startsWith(github.ref, 'refs/tags/') }}
        run: |
          echo "Run this workflow with a release tag as the ref" >&2
          exit 1
      # Refuse to release when a component changed without a version bump or the tag is not the
      # product version (ADR 0012).
      - name: Check versions
        if: ${{ !github.event.pull_request }}
        run: python3 ../scripts/version.py check --release --tag "${{ github.ref_name }}"
      - name: Install dist
        # we specify bash to get pipefail; it guards against the `curl` command
        # failing. otherwise `sh` won't catch that `curl` returned non-0
        shell: bash
        run: "curl --proto '=https' --tlsv1.2 -LsSf https://github.com/axodotdev/cargo-dist/releases/download/v0.34.0/cargo-dist-installer.sh | sh"
      - name: Cache dist
        uses: actions/upload-artifact@v7
        with:
          name: cargo-dist-cache
          path: ~/.cargo/bin/dist
      # sure would be cool if github gave us proper conditionals...
      # so here's a doubly-nested ternary-via-truthiness to try to provide the best possible
      # functionality based on whether this is a pull_request, and whether it's from a fork.
      # (PRs run on the *source* but secrets are usually on the *target* -- that's *good*
      # but also really annoying to build CI around when it needs secrets to work right.)
      - id: plan
        run: |
          dist ${{ (!github.event.pull_request && format('host --steps=create --tag={0}', github.ref_name)) || 'plan' }} --output-format=json > plan-dist-manifest.json
          echo "dist ran successfully"
          cat plan-dist-manifest.json
          echo "manifest=$(jq -c "." plan-dist-manifest.json)" >> "$GITHUB_OUTPUT"
      - name: "Upload dist-manifest.json"
        uses: actions/upload-artifact@v7
        with:
          name: artifacts-plan-dist-manifest
          path: backend/plan-dist-manifest.json

  # Build and packages all the platform-specific things
  build-local-artifacts:
    name: build-local-artifacts (${{ join(matrix.targets, ', ') }})
    # Let the initial task tell us to not run (currently very blunt)
    needs:
      - plan
    if: ${{ fromJson(needs.plan.outputs.val).ci.github.artifacts_matrix.include != null && (needs.plan.outputs.publishing == 'true' || fromJson(needs.plan.outputs.val).ci.github.pr_run_mode == 'upload') }}
    strategy:
      fail-fast: false
      # Target platforms/runners are computed by dist in create-release.
      # Each member of the matrix has the following arguments:
      #
      # - runner: the github runner
      # - dist-args: cli flags to pass to dist
      # - install-dist: expression to run to install dist on the runner
      #
      # Typically there will be:
      # - 1 "global" task that builds universal installers
      # - N "local" tasks that build each platform's binaries and platform-specific installers
      matrix: ${{ fromJson(needs.plan.outputs.val).ci.github.artifacts_matrix }}
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container && matrix.container.image || null }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      BUILD_MANIFEST_NAME: target/distrib/${{ join(matrix.targets, '-') }}-dist-manifest.json
      KOR_UPDATE_PUBKEY: ${{ vars.KOR_UPDATE_PUBKEY }}
    permissions:
      "attestations": "write"
      "contents": "read"
      "id-token": "write"
    steps:
      - name: enable windows longpaths
        # Runs before checkout, so the default `backend` working directory does not exist yet.
        working-directory: ${{ github.workspace }}
        run: |
          git config --global core.longpaths true
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: recursive
      - name: Install Rust non-interactively if not already installed
        if: ${{ matrix.container }}
        run: |
          if ! command -v cargo > /dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
            echo "$HOME/.cargo/bin" >> $GITHUB_PATH
          fi
      - name: Install dist
        run: ${{ matrix.install_dist.run }}
      # Get the dist-manifest
      - name: Fetch local artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: artifacts-*
          path: backend/target/distrib/
          merge-multiple: true
      # BoringSSL (kor-proxy's TLS client) assembles with NASM on Windows; runners do not ship it.
      - if: runner.os == 'Windows'
        uses: ilammy/setup-nasm@v1
      - name: Install dependencies
        run: |
          ${{ matrix.packages_install }}
      - name: Build artifacts
        run: |
          # Actually do builds and make zips and whatnot
          dist build ${{ needs.plan.outputs.tag-flag }} --print=linkage --output-format=json ${{ matrix.dist_args }} > dist-manifest.json
          echo "dist ran successfully"
      - name: Attest
        uses: actions/attest@v4
        with:
          subject-path: "backend/target/distrib/*${{ join(matrix.targets, ', ') }}*"
      - id: cargo-dist
        name: Post-build
        # We force bash here just because github makes it really hard to get values up
        # to "real" actions without writing to env-vars, and writing to env-vars has
        # inconsistent syntax between shell and powershell.
        shell: bash
        run: |
          # Parse out what we just built and upload it to scratch storage
          echo "paths<<EOF" >> "$GITHUB_OUTPUT"
          dist print-upload-files-from-manifest --manifest dist-manifest.json | sed -E 's#^([^/A-Za-z]|[A-Za-z][^:])#backend/\1#' >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

          cp dist-manifest.json "$BUILD_MANIFEST_NAME"
      - name: "Upload artifacts"
        uses: actions/upload-artifact@v7
        with:
          name: artifacts-build-local-${{ join(matrix.targets, '_') }}
          path: |
            ${{ steps.cargo-dist.outputs.paths }}
            backend/${{ env.BUILD_MANIFEST_NAME }}

  # Build and package all the platform-agnostic(ish) things
  build-global-artifacts:
    needs:
      - plan
      - build-local-artifacts
    runs-on: "ubuntu-22.04"
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      BUILD_MANIFEST_NAME: target/distrib/global-dist-manifest.json
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: recursive
      - name: Install cached dist
        uses: actions/download-artifact@v8
        with:
          name: cargo-dist-cache
          path: ~/.cargo/bin/
      - run: chmod +x ~/.cargo/bin/dist
      # Get all the local artifacts for the global tasks to use (for e.g. checksums)
      - name: Fetch local artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: artifacts-*
          path: backend/target/distrib/
          merge-multiple: true
      - id: cargo-dist
        shell: bash
        run: |
          dist build ${{ needs.plan.outputs.tag-flag }} --output-format=json "--artifacts=global" > dist-manifest.json
          echo "dist ran successfully"

          # Parse out what we just built and upload it to scratch storage
          echo "paths<<EOF" >> "$GITHUB_OUTPUT"
          jq --raw-output ".upload_files[]" dist-manifest.json | sed -E 's#^([^/A-Za-z]|[A-Za-z][^:])#backend/\1#' >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

          cp dist-manifest.json "$BUILD_MANIFEST_NAME"
      - name: "Upload artifacts"
        uses: actions/upload-artifact@v7
        with:
          name: artifacts-build-global
          path: |
            ${{ steps.cargo-dist.outputs.paths }}
            backend/${{ env.BUILD_MANIFEST_NAME }}
  # Desktop installers with the kor CLI as sidecar (ADR 0032). Runs on PRs too (unsigned, never published).
  desktop:
    name: desktop (${{ matrix.name }})
    needs:
      - plan
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            cli-targets: x86_64-pc-windows-msvc
            bundles: msi,nsis
          - name: macos-universal
            runner: macos-latest
            target: universal-apple-darwin
            cli-targets: aarch64-apple-darwin x86_64-apple-darwin
            bundles: app,dmg
          - name: linux-x64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            cli-targets: x86_64-unknown-linux-gnu
            bundles: deb,rpm,appimage
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
        working-directory: frontend
    env:
      # The bundled CLI checks `kor update` signatures with the same key as the cargo-dist binaries.
      KOR_UPDATE_PUBKEY: ${{ vars.KOR_UPDATE_PUBKEY }}
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: dtolnay/rust-toolchain@1.94.0
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || matrix.target }}
      # BoringSSL (kor-proxy's TLS client) assembles with NASM on Windows; runners do not ship it.
      - if: runner.os == 'Windows'
        uses: ilammy/setup-nasm@v1
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf file pkg-config libwayland-dev libgbm-dev libdrm-dev libpipewire-0.3-dev libspa-0.2-dev libclang-dev clang libdbus-1-dev libegl-dev
      - run: npm ci
      # §27.10 PowerToys Run plugin (ADR 0052): shipped as bundle resource `integrations/powertoys`
      # (tauri.release.conf.json); `kor os-integration install powertoys-run` copies it. Other OSes
      # get an empty folder so the resource path exists.
      - if: runner.os == 'Windows'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - name: Build the PowerToys Run plugin
        run: |
          mkdir -p src-tauri/integrations/powertoys
          if [ "$RUNNER_OS" = Windows ]; then
            dotnet publish ../integrations/powertoys/Community.PowerToys.Run.Plugin.Kor.csproj \
              -c Release -p:Platform=x64 -o src-tauri/integrations/powertoys
          else
            echo "PowerToys Run is Windows only." > src-tauri/integrations/powertoys/README.txt
          fi
      - name: Build the kor CLI sidecar
        run: |
          mkdir -p src-tauri/binaries
          ext=""; [ "$RUNNER_OS" = Windows ] && ext=.exe
          for t in ${{ matrix.cli-targets }}; do
            (cd ../backend && cargo build --locked --release -p kor-cli --target "$t")
          done
          if [ "$RUNNER_OS" = macOS ]; then
            lipo -create -output src-tauri/binaries/kor-universal-apple-darwin \
              ../backend/target/aarch64-apple-darwin/release/kor ../backend/target/x86_64-apple-darwin/release/kor
            # A universal build compiles each arch separately; each build script looks for its own triple.
            for t in aarch64-apple-darwin x86_64-apple-darwin; do cp "../backend/target/$t/release/kor" "src-tauri/binaries/kor-$t"; done
          else
            cp "../backend/target/${{ matrix.target }}/release/kor$ext" "src-tauri/binaries/kor-${{ matrix.target }}$ext"
          fi
      # Windows 11 top-level context menu + Widgets provider as sparse packages (ADR 0052). The MSIX
      # publisher must equal the signing certificate's subject (vars.KOR_MSIX_PUBLISHER).
      - name: Shell extension and sparse packages (Windows)
        if: runner.os == 'Windows'
        env:
          KOR_MSIX_PUBLISHER: ${{ vars.KOR_MSIX_PUBLISHER }}
        run: |
          (cd ../backend && cargo build --locked --release -p kor-shellext --target "${{ matrix.target }}")
          d="$PWD/src-tauri/shellext"; mkdir -p "$d"
          cp "../backend/target/${{ matrix.target }}/release/kor_shellext.dll" "../backend/target/${{ matrix.target }}/release/kor-widgets.exe" "$d/"
          v=$(jq -r .version src-tauri/tauri.conf.json)
          (cd ../backend && cargo run --locked --release -p kor-platform --example sparse_package -- \
            "$d" "${KOR_MSIX_PUBLISHER:-CN=Kor Unsigned}" "$v" x64 "$PWD/../frontend/src-tauri/icons/128x128.png")
          jq -n '{bundle:{resources:{"shellext/":"shellext/"}}}' > "$RUNNER_TEMP/tauri.os.json"
      # Finder Sync extension inside Kor.app (ADR 0052); signed by the same identity as the app.
      - name: Finder Sync extension (macOS)
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          identity=-
          if [ -n "$APPLE_CERTIFICATE" ] && [ -n "$SIGNING_IDENTITY" ]; then
            kc="$RUNNER_TEMP/finder.keychain-db"; pw=$(uuidgen)
            security create-keychain -p "$pw" "$kc"
            security set-keychain-settings -lut 21600 "$kc"
            security unlock-keychain -p "$pw" "$kc"
            printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/finder.p12"
            security import "$RUNNER_TEMP/finder.p12" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$kc"
            rm -f "$RUNNER_TEMP/finder.p12"
            security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
            security set-key-partition-list -S apple-tool:,apple: -s -k "$pw" "$kc"
            identity="$SIGNING_IDENTITY"
          fi
          v=$(jq -r .version src-tauri/tauri.conf.json)
          ../scripts/build-finder-sync.sh "$RUNNER_TEMP/finder" "$v" "$identity"
          jq -n --arg p "$RUNNER_TEMP/finder/KorFinderSync.appex" \
            '{bundle:{macOS:{files:{"PlugIns/KorFinderSync.appex":$p}}}}' > "$RUNNER_TEMP/tauri.os.json"
      - name: Signing configuration
        id: sign
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_SIGNING_ENDPOINT: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          AZURE_SIGNING_PROFILE: ${{ vars.AZURE_SIGNING_PROFILE }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_UPDATER_PUBKEY: ${{ vars.TAURI_UPDATER_PUBKEY }}
        run: |
          os_signed=false
          cfg='{}'
          case "$RUNNER_OS" in
            Windows)
              if [ -n "$AZURE_CLIENT_SECRET" ] && [ -n "$AZURE_SIGNING_ENDPOINT" ]; then
                cargo install trusted-signing-cli --locked
                cfg=$(jq -n --arg e "$AZURE_SIGNING_ENDPOINT" --arg a "$AZURE_SIGNING_ACCOUNT" --arg c "$AZURE_SIGNING_PROFILE" \
                  '{bundle:{windows:{signCommand:{cmd:"trusted-signing-cli",args:["-e",$e,"-a",$a,"-c",$c,"-d","Kor","%1"]}}}}')
                os_signed=true
              fi ;;
            macOS)
              # Without a Developer ID the app is ad-hoc signed ("-"): it runs, Gatekeeper warns.
              if [ -n "$APPLE_CERTIFICATE" ] && [ -n "$APPLE_ID" ]; then os_signed=true; fi ;;
            Linux)
              if [ -n "$GPG_PRIVATE_KEY" ]; then os_signed=true; fi ;;
          esac
          updater=false
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            if [ -z "$TAURI_UPDATER_PUBKEY" ]; then
              # Degrade, do not fail: without the public key the app could not verify its own updates.
              echo "::warning::TAURI_SIGNING_PRIVATE_KEY is set but the TAURI_UPDATER_PUBKEY variable is not: no in-app updates for this build"
              unset TAURI_SIGNING_PRIVATE_KEY
            fi
          fi
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            cfg=$(jq -n --argjson base "$cfg" --arg k "$TAURI_UPDATER_PUBKEY" \
              '$base * {bundle:{createUpdaterArtifacts:true},plugins:{updater:{pubkey:$k}}}')
            updater=true
          fi
          echo "$cfg" > "$RUNNER_TEMP/tauri.ci.json"
          echo "os_signed=$os_signed" >> "$GITHUB_OUTPUT"
          echo "updater=$updater" >> "$GITHUB_OUTPUT"
      - name: Sign the sidecar (Windows)
        if: ${{ runner.os == 'Windows' && steps.sign.outputs.os_signed == 'true' }}
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: >
          trusted-signing-cli -e "${{ vars.AZURE_SIGNING_ENDPOINT }}" -a "${{ vars.AZURE_SIGNING_ACCOUNT }}"
          -c "${{ vars.AZURE_SIGNING_PROFILE }}" -d Kor "src-tauri/binaries/kor-${{ matrix.target }}.exe"
      - name: Sign the shell extension and sparse packages (Windows)
        if: ${{ runner.os == 'Windows' && steps.sign.outputs.os_signed == 'true' }}
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: |
          for f in src-tauri/shellext/kor_shellext.dll src-tauri/shellext/kor-widgets.exe \
                   src-tauri/shellext/Kor.ShellIntegration.msix src-tauri/shellext/Kor.Widgets.msix; do
            trusted-signing-cli -e "${{ vars.AZURE_SIGNING_ENDPOINT }}" -a "${{ vars.AZURE_SIGNING_ACCOUNT }}" \
              -c "${{ vars.AZURE_SIGNING_PROFILE }}" -d Kor "$f"
          done
      - name: Build installers
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          # Empty values would make tauri try (and fail) to sign or notarize: unset them.
          for v in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID \
                   TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD; do
            [ -n "${!v}" ] || unset "$v"
          done
          if [ "$RUNNER_OS" = macOS ]; then
            export APPLE_SIGNING_IDENTITY="${SIGNING_IDENTITY:--}"
          fi
          # Per-OS additions (shell extension resources / Finder extension) from the steps above.
          os_cfg=()
          if [ -f "$RUNNER_TEMP/tauri.os.json" ]; then os_cfg=(--config "$RUNNER_TEMP/tauri.os.json"); fi
          npx tauri build --target "${{ matrix.target }}" --bundles "${{ matrix.bundles }}" \
            --config src-tauri/tauri.release.conf.json --config "$RUNNER_TEMP/tauri.ci.json" "${os_cfg[@]}"
      - name: Collect, GPG-sign (Linux) and mark unsigned
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          out="$RUNNER_TEMP/desktop"; mkdir -p "$out"
          b="src-tauri/target/${{ matrix.target }}/release/bundle"
          v=$(jq -r .version src-tauri/tauri.conf.json)
          shopt -s nullglob
          for f in "$b"/msi/*.msi* "$b"/nsis/*.exe* "$b"/dmg/*.dmg "$b"/deb/*.deb "$b"/rpm/*.rpm "$b"/appimage/*.AppImage*; do
            cp "$f" "$out/"
          done
          for f in "$b"/macos/*.app.tar.gz*; do
            cp "$f" "$out/Kor_${v}_universal.app.tar.gz${f##*.app.tar.gz}"
          done
          # §24.4 portable Windows .zip (ADR 0064): the app, the kor CLI, resources and the VC++ runtime
          # DLLs (the installers get them from bundle.windows.bundleVCRuntime). WebView2 is part of
          # Windows 11; on older systems the installers are the way.
          if [ "$RUNNER_OS" = Windows ]; then
            r="src-tauri/target/${{ matrix.target }}/release"; p="$RUNNER_TEMP/portable/Kor"
            mkdir -p "$p"
            cp "$r/kor-desktop.exe" "$p/"
            cp "src-tauri/binaries/kor-${{ matrix.target }}.exe" "$p/kor.exe"
            for d in extension integrations shellext; do [ -d "$r/$d" ] && cp -r "$r/$d" "$p/"; done
            for dll in vcruntime140.dll vcruntime140_1.dll msvcp140.dll; do cp "/c/Windows/System32/$dll" "$p/"; done
            pwsh -NoProfile -Command "Compress-Archive -Path '$RUNNER_TEMP/portable/Kor' -DestinationPath '$out/Kor_${v}_x64_portable.zip'"
          fi
          if [ "$RUNNER_OS" = Linux ] && [ -n "$GPG_PRIVATE_KEY" ]; then
            printf '%s\n' "$GPG_PRIVATE_KEY" | gpg --batch --import
            for f in "$out"/*.deb "$out"/*.rpm "$out"/*.AppImage; do
              gpg --batch --yes --pinentry-mode loopback --passphrase "$GPG_PASSPHRASE" --armor --detach-sign "$f"
            done
          fi
          if [ "${{ steps.sign.outputs.os_signed }}" != true ]; then
            # Clearly marked: Kor_1.2.3_x64-setup.exe -> Kor_1.2.3_x64-setup_UNSIGNED.exe (updater .sig follows).
            for f in "$out"/*; do
              n=$(basename "$f"); tail=""
              case "$n" in *.sig|*.asc) tail=".${n##*.}"; n=${n%.*} ;; esac
              case "$n" in
                *.app.tar.gz) stem=${n%.app.tar.gz}; ext=.app.tar.gz ;;
                *) stem=${n%.*}; ext=".${n##*.}" ;;
              esac
              mv "$f" "$out/${stem}_UNSIGNED${ext}${tail}"
            done
          fi
          jq -n --arg n "${{ matrix.name }}" --argjson s "${{ steps.sign.outputs.os_signed }}" \
            --argjson u "${{ steps.sign.outputs.updater }}" '{name:$n,os_signed:$s,updater_signed:$u}' \
            > "$out/signing-${{ matrix.name }}.json"
          ls -la "$out"
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.name }}
          path: ${{ runner.temp }}/desktop/*

  # §17.2: a release waits for the CI run of its own commit. The end-to-end jobs (CLI, TUI, desktop,
  # brand visuals) and the UI audit inside the desktop job must pass; their HTML report and the
  # coverage report are published with the release.
  gate:
    needs: plan
    if: ${{ needs.plan.outputs.publishing == 'true' }}
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      SHA: ${{ github.sha }}
      REPO: ${{ github.repository }}
    steps:
      - name: Wait for the commit's CI run
        id: ci
        run: |
          for i in $(seq 1 150); do
            run=$(gh api "repos/$REPO/actions/workflows/ci.yml/runs?head_sha=$SHA&event=push&per_page=1" --jq '.workflow_runs[0] | "\(.id) \(.status)"')
            set -- $run
            if [ -n "${1:-}" ] && [ "$2" = "completed" ]; then echo "id=$1" >> "$GITHUB_OUTPUT"; exit 0; fi
            sleep 60
          done
          echo "::error::no completed CI run for $SHA after 150 minutes"
          exit 1
      - name: End-to-end jobs and the UI audit passed
        run: |
          gh api --paginate "repos/$REPO/actions/runs/${{ steps.ci.outputs.id }}/jobs?per_page=100"             --jq '.jobs[] | select(.name | startswith("e2e ")) | "\(.conclusion) \(.name)"' > jobs.txt
          cat jobs.txt
          [ -s jobs.txt ] || { echo "::error::the CI run has no end-to-end jobs"; exit 1; }
          if grep -v '^success ' jobs.txt; then echo "::error::end-to-end gate failed"; exit 1; fi
      - name: Collect the reports
        run: |
          mkdir -p reports
          gh run download "${{ steps.ci.outputs.id }}" -R "$REPO" -n coverage -D cov || echo "::warning::no coverage report in the CI run"
          [ -f cov/coverage-summary.txt ] && cp cov/coverage-summary.txt "reports/coverage-${{ needs.plan.outputs.tag }}.txt"
          gh run download "${{ steps.ci.outputs.id }}" -R "$REPO" -n e2e-desktop-windows-latest -D e2e || echo "::warning::no desktop e2e artifact"
          if [ -d e2e/reports ]; then (cd e2e/reports && zip -qr "../../reports/e2e-${{ needs.plan.outputs.tag }}.zip" .); fi
          ls -l reports
      - uses: actions/upload-artifact@v7
        with:
          name: gate-reports
          path: reports/*
          if-no-files-found: ignore

  # Determines if we should publish/announce
  host:
    needs:
      - plan
      - gate
      - build-local-artifacts
      - build-global-artifacts
      - desktop
    # Only run if we're "publishing", and only if plan, local, global and desktop didn't fail (skipped is fine)
    if: ${{ always() && needs.plan.result == 'success' && needs.plan.outputs.publishing == 'true' && needs.gate.result == 'success' && needs.desktop.result == 'success' && (needs.build-global-artifacts.result == 'skipped' || needs.build-global-artifacts.result == 'success') && (needs.build-local-artifacts.result == 'skipped' || needs.build-local-artifacts.result == 'success') }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    runs-on: "ubuntu-24.04"  # minisign is packaged from 24.04 on
    outputs:
      val: ${{ steps.host.outputs.manifest }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: recursive
      # ubuntu-22.04's python3 is 3.10; the release helpers need 3.11+ (tomllib).
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install cached dist
        uses: actions/download-artifact@v8
        with:
          name: cargo-dist-cache
          path: ~/.cargo/bin/
      - run: chmod +x ~/.cargo/bin/dist
      # Desktop installers first: an unsigned one stops the release before anything is published.
      - name: Fetch desktop installers
        uses: actions/download-artifact@v8
        with:
          pattern: desktop-*
          path: desktop
          merge-multiple: true
      # Unsigned installers are published with a warning unless vars.KOR_REQUIRE_SIGNED is 'true'.
      - name: Check desktop installer signatures
        working-directory: .
        run: python3 scripts/desktop_release.py gate desktop ${{ (inputs.allow-unsigned || vars.KOR_REQUIRE_SIGNED != 'true') && '--allow-unsigned' || '' }}
      - name: Fetch the gate's reports (coverage, end-to-end)
        uses: actions/download-artifact@v8
        with:
          name: gate-reports
          path: desktop
        continue-on-error: true
      # Fetch artifacts from scratch-storage
      - name: Fetch artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: artifacts-*
          path: backend/target/distrib/
          merge-multiple: true
      - id: host
        shell: bash
        run: |
          dist host ${{ needs.plan.outputs.tag-flag }} --steps=upload --steps=release --output-format=json > dist-manifest.json
          echo "artifacts uploaded and released successfully"
          cat dist-manifest.json
          echo "manifest=$(jq -c "." dist-manifest.json)" >> "$GITHUB_OUTPUT"
      - name: "Upload dist-manifest.json"
        uses: actions/upload-artifact@v7
        with:
          # Overwrite the previous copy
          name: artifacts-dist-manifest
          path: backend/dist-manifest.json
      # Create a GitHub Release while uploading all files to it
      - name: "Download GitHub Artifacts"
        uses: actions/download-artifact@v8
        with:
          pattern: artifacts-*
          path: backend/artifacts
          merge-multiple: true
      - name: Cleanup
        run: |
          # Remove the granular manifests
          rm -f artifacts/*-dist-manifest.json
      - name: Sign raw binaries for kor update
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
        run: |
          if [ -z "$MINISIGN_SECRET_KEY" ]; then
            echo "MINISIGN_SECRET_KEY is not set: no signed binaries, kor update will only notify"
            exit 0
          fi
          sudo apt-get update && sudo apt-get install -y minisign
          # A key pasted on Windows carries \r; a key pasted without its first line lacks the
          # "untrusted comment:" header minisign requires. Normalise both.
          key=$(printf '%s\n' "$MINISIGN_SECRET_KEY" | tr -d '\r' | sed '/^[[:space:]]*$/d')
          case "$key" in "untrusted comment:"*) ;; *) key=$(printf 'untrusted comment: minisign secret key\n%s' "$key") ;; esac
          printf '%s\n' "$key" > "$RUNNER_TEMP/kor.key"
          unset key
          # A key minisign still cannot read must not stop the release: binaries go out unsigned.
          probe="$RUNNER_TEMP/probe.txt"; echo probe > "$probe"
          if ! minisign -S -s "$RUNNER_TEMP/kor.key" -m "$probe" -x "$probe.minisig" < /dev/null > /dev/null 2>&1; then
            echo "::warning::MINISIGN_SECRET_KEY could not be loaded (unencrypted key from 'minisign -G -W' expected); kor update binaries are not signed"
            rm -f "$RUNNER_TEMP/kor.key" "$probe" "$probe.minisig"
            exit 0
          fi
          rm -f "$probe" "$probe.minisig"
          mkdir -p "$RUNNER_TEMP/x"
          for a in artifacts/kor-cli-*.tar.xz artifacts/kor-cli-*.zip; do
            [ -f "$a" ] || continue
            t=$(basename "$a"); t=${t#kor-cli-}; t=${t%.tar.xz}; t=${t%.zip}
            rm -rf "$RUNNER_TEMP/x"/*
            case "$a" in *.zip) unzip -q "$a" -d "$RUNNER_TEMP/x" ;; *) tar -xJf "$a" -C "$RUNNER_TEMP/x" ;; esac
            exe=$(find "$RUNNER_TEMP/x" -type f \( -name kor -o -name kor.exe \) | head -1)
            out="artifacts/kor-$t"; case "$exe" in *.exe) out="$out.exe" ;; esac
            cp "$exe" "$out"
            minisign -S -s "$RUNNER_TEMP/kor.key" -m "$out" -x "$out.minisig" -t "kor $t ${{ needs.plan.outputs.tag }}"
          done
          rm -f "$RUNNER_TEMP/kor.key"
      - name: Desktop installers, updater manifest, package-manager manifests
        working-directory: .
        env:
          KOR_UPDATE_PUBKEY: ${{ vars.KOR_UPDATE_PUBKEY }}
        run: |
          rm -f desktop/signing-*.json
          python3 scripts/desktop_release.py latest-json desktop "${{ needs.plan.outputs.tag }}" "${{ github.repository }}"
          python3 scripts/desktop_release.py manifests desktop "${{ needs.plan.outputs.tag }}" "${{ github.repository }}"
          # §24.4 `curl -fsSL get.kor.dev | sh` (ADR 0064): the readable installer with the release key in it.
          sed "s|^PUBKEY=\"\"|PUBKEY=\"$KOR_UPDATE_PUBKEY\"|; s|^REPO=\".*\"|REPO=\"${{ github.repository }}\"|" scripts/install.sh > desktop/install.sh
          cp desktop/* backend/artifacts/
      - name: Create GitHub Release
        env:
          PRERELEASE_FLAG: "${{ fromJson(steps.host.outputs.manifest).announcement_is_prerelease && '--prerelease' || '' }}"
          ANNOUNCEMENT_TITLE: "${{ fromJson(steps.host.outputs.manifest).announcement_title }}"
          ANNOUNCEMENT_BODY: "${{ fromJson(steps.host.outputs.manifest).announcement_github_body }}"
          RELEASE_COMMIT: "${{ github.sha }}"
        run: |
          # Write and read notes from a file to avoid quoting breaking things
          echo "$ANNOUNCEMENT_BODY" > $RUNNER_TEMP/notes.txt

          gh release create "${{ needs.plan.outputs.tag }}" --target "$RELEASE_COMMIT" $PRERELEASE_FLAG --title "$ANNOUNCEMENT_TITLE" --notes-file "$RUNNER_TEMP/notes.txt" artifacts/*

  announce:
    needs:
      - plan
      - host
    # use "always() && ..." to allow us to wait for all publish jobs while
    # still allowing individual publish jobs to skip themselves (for prereleases).
    # "host" however must run to completion, no skipping allowed!
    if: ${{ always() && needs.host.result == 'success' }}
    runs-on: "ubuntu-22.04"
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: recursive
