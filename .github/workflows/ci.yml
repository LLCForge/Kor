# SPDX-License-Identifier: Apache-2.0 OR MIT
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  # rustc needs more stack than the default for the fat-LTO link of the CLI (SIGBUS/SIGSEGV otherwise).
  RUST_MIN_STACK: "268435456"

jobs:
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      # Byte-exact checkout as in the repo (generated files and scanners expect it).
      - if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
        # Before checkout the job's default working directory does not exist yet.
        working-directory: .
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
      - if: runner.os == 'Linux'
        run: bash ../scripts/ci-linux-deps.sh
      - name: Versions are consistent (ADR 0012)
        run: python3 ../scripts/version.py check
      - name: Desktop release helpers (ADR 0032)
        run: python3 ../scripts/desktop_release.py selftest
      - run: cargo fmt --all --check
      # --keep-going: every crate's findings in one run, not only the first failing crate's.
      - run: cargo clippy --workspace --all-targets --keep-going -- -D warnings
      # §32.2 (ADR 0062): blocking I/O on async/render threads, unbounded channels, uncached regexes.
      # A ratchet: a file may not gain findings over kor-lint.baseline.json.
      - name: kor-lint
        run: cargo run --locked -p kor-lint -- --baseline kor-lint.baseline.json crates apps ../frontend/src-tauri/src
      - run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, macos-15-intel, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: backend
    env:
      # The local embedding model's matrix kernels (candle → gemm) use FP16 instructions on Arm Linux.
      RUSTFLAGS: ${{ matrix.os == 'ubuntu-24.04-arm' && '-D warnings -C target-feature=+fp16' || '-D warnings' }}
    steps:
      # Byte-exact checkout as in the repo (generated files and scanners expect it).
      - if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
        # Before checkout the job's default working directory does not exist yet.
        working-directory: .
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
      - if: runner.os == 'Linux'
        run: bash ../scripts/ci-linux-deps.sh
      - run: cargo test --workspace --locked
      # Faz 0 kabulü: sürüm ve doctor her platformda hatasız. Başsız Linux'ta anahtar zinciri uyarıdır, hata değil.
      - run: cargo run --locked -p kor-cli -- --version
      - run: cargo run --locked -p kor-cli -- doctor --lang en

  # §13.3: line coverage of the Rust workspace, with a floor. kor-proxy is measured on its own.
  coverage:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      COVERAGE_MIN: 80
    steps:
      # Byte-exact checkout as in the repo (generated files and scanners expect it).
      - if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
        # Before checkout the job's default working directory does not exist yet.
        working-directory: .
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94.0
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
      - if: runner.os == 'Linux'
        run: bash ../scripts/ci-linux-deps.sh
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - run: cargo llvm-cov --workspace --locked --exclude kor-proxy --lcov --output-path lcov.info
      - run: cargo llvm-cov report --summary-only | tee coverage-summary.txt
      - name: Line coverage at least ${{ env.COVERAGE_MIN }}%
        run: cargo llvm-cov report --fail-under-lines "$COVERAGE_MIN" > /dev/null
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            backend/lcov.info
            backend/coverage-summary.txt
          if-no-files-found: ignore

  cross-build:
    name: build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, target: x86_64-apple-darwin, args: --workspace }
          - { os: macos-latest, target: aarch64-apple-darwin, args: --workspace }
          # Static Linux CLI and Windows ARM64 (§32, dist targets): kor-cli only. Its build.rs leaves
          # out `kor proxy` (BoringSSL) there and kor-computer has no screen capture on musl (PipeWire).
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl, args: -p kor-cli, smoke: true }
          - { os: windows-11-arm, target: aarch64-pc-windows-msvc, args: -p kor-cli, smoke: true }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: backend
    steps:
      # Byte-exact checkout as in the repo (generated files and scanners expect it).
      - if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
        # Before checkout the job's default working directory does not exist yet.
        working-directory: .
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94.0
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
          key: ${{ matrix.target }}
      - if: endsWith(matrix.target, '-musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      # ring and aws-lc assemble their ARM64 Windows code with clang.
      - if: matrix.target == 'aarch64-pc-windows-msvc'
        shell: bash
        run: command -v clang || choco install -y llvm
      - run: cargo build --locked --release --target ${{ matrix.target }} ${{ matrix.args }}
      # The build runs natively; the left-out features say so instead of failing.
      - if: matrix.smoke
        shell: bash
        run: |
          kor=target/${{ matrix.target }}/release/kor
          [ -x "$kor.exe" ] && kor="$kor.exe"
          "$kor" --version
          if [[ "${{ matrix.target }}" == *-musl ]]; then file "$kor" | grep -Eq "statically linked|static-pie linked"; fi
          out=$("$kor" --lang en proxy status 2>&1) && { echo "kor proxy should be absent: $out"; exit 1; }
          echo "$out" | grep -q "not available in this build"

  desktop:
    name: desktop (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # Byte-exact checkout as in the repo (generated files and scanners expect it).
      - if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
        # Before checkout the job's default working directory does not exist yet.
        working-directory: .
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94.0
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: frontend/src-tauri
      - if: runner.os == 'Linux'
        run: bash scripts/ci-linux-deps.sh
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - working-directory: frontend
        run: npm ci
      - working-directory: frontend
        run: npm run typecheck
      - working-directory: frontend
        # parity.test.ts + kor-cmd.test.ts (ADR 0031) are in renderer/; panel tests live one level down.
        # perfmon/: budgets maths and the §32.2 unnecessary re-render counter.
        run: node --test src/desktop/renderer/*.test.ts src/desktop/renderer/i18n/*.test.ts src/desktop/renderer/panels/*/*.test.ts src/desktop/renderer/review/*.test.ts src/desktop/renderer/perfmon/*.test.ts
      - working-directory: frontend
        # ADR 0053: theme.json single source + no hand-copied hex, raw hex/px only in legacy files,
        # WebView lockdown policy, kor-ui components.
        run: node --test scripts/*.test.ts src/desktop/renderer/kor-ui/*.test.ts
      - working-directory: frontend
        # ADR 0061: ipc.gen.ts is generated from kor-core/schema/ipc.json (the Rust side: src-tauri
        # tests/ipc_schema.rs in `cargo test` below); a stale file fails here, a drifting renderer in
        # scripts/ipc-gen.test.ts above, every asset referenced in scripts/assets-check.test.ts.
        run: node scripts/ipc-gen.ts --check
      - working-directory: frontend
        run: npm run build:ui
      - working-directory: frontend
        # ADR 0058: browser extension (transport, pairing, tab groups, domain policy, manifests, panel events, i18n).
        run: node --test src/extension/extension.test.ts
      - working-directory: frontend/src-tauri
        run: cargo clippy --all-targets -- -D warnings
      - working-directory: frontend/src-tauri
        run: cargo test

  # ADR 0058 §18.4: the built extension in a real Chromium (Chrome for Testing honours --load-extension),
  # driven through the bridge with the existing CDP code: pairing, task tab group, tools, refusals.
  extension:
    runs-on: ubuntu-latest
    steps:
      # Byte-exact checkout as in the repo (generated files and scanners expect it).
      - if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
        # Before checkout the job's default working directory does not exist yet.
        working-directory: .
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
      - if: runner.os == 'Linux'
        run: bash scripts/ci-linux-deps.sh
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci && npm run build:extension
      - name: Chrome for Testing
        run: |
          npx --yes @puppeteer/browsers@2.10.5 install chrome@stable --path "$RUNNER_TEMP/cft" > "$RUNNER_TEMP/cft.txt"
          echo "KOR_BROWSER=$(awk '{print $2}' "$RUNNER_TEMP/cft.txt" | tail -n1)" >> "$GITHUB_ENV"
      # The extension runs in a visible browser window: a virtual display on the runner.
      - run: sudo apt-get install -y xvfb
      # Ubuntu 24.04's AppArmor blocks the unprivileged user namespaces Chrome's sandbox needs, so
      # the browser exits before it opens DevTools; allow them instead of dropping the sandbox.
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - working-directory: backend
        run: xvfb-run -a cargo test --locked -p kor-tools --lib -- --ignored real_extension

  msrv:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      # Byte-exact checkout as in the repo (generated files and scanners expect it).
      - if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
        # Before checkout the job's default working directory does not exist yet.
        working-directory: .
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
      - if: runner.os == 'Linux'
        run: bash ../scripts/ci-linux-deps.sh
      # rust-toolchain.toml pins the development toolchain; the MSRV check overrides it.
      - run: cargo check --workspace --locked
        env:
          RUSTUP_TOOLCHAIN: "1.94.0"

  # Repo hygiene on every PR: self-tests of the release helpers and of scripts/install.sh
  # (checksum and signature verification).
  repo-checks:
    runs-on: ubuntu-latest
    steps:
      # Byte-exact checkout as in the repo (generated files and scanners expect it).
      - if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
        # Before checkout the job's default working directory does not exist yet.
        working-directory: .
      - uses: actions/checkout@v4
      - name: Tooling self-tests (desktop release, install.sh)
        run: |
          python3 scripts/desktop_release.py selftest
          sh scripts/install-test.sh

  supply-chain:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      # Byte-exact checkout as in the repo (generated files and scanners expect it).
      - if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
        # Before checkout the job's default working directory does not exist yet.
        working-directory: .
      - uses: actions/checkout@v4
      # On the runner, not in the actions' containers: rust-toolchain.toml names a toolchain the
      # containers do not have.
      - uses: dtolnay/rust-toolchain@1.94.0
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny,cargo-audit
      - run: cargo deny --locked check
      - run: cargo audit

  # §32.1/§32.3 (ADR 0062): every PR measures the performance budgets on a release build. A budget over
  # its target, or any measurement more than 5% slower than the runner baseline in bench/history.json
  # (none in a fresh checkout: budgets only), fails the job.
  perf:
    name: perf (${{ matrix.worker }})
    # Report-only until the open budgets in kalanlar.md (CLI binary size, 1M-vector search) are met;
    # the table stays in the log and a regression elsewhere still shows as OVER.
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        worker: [standard, weak]
    runs-on: ubuntu-latest
    steps:
      # Byte-exact checkout as in the repo (generated files and scanners expect it).
      - if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
        # Before checkout the job's default working directory does not exist yet.
        working-directory: .
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            backend
            frontend/src-tauri
      - if: runner.os == 'Linux'
        run: bash scripts/ci-linux-deps.sh
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf xvfb
      - working-directory: backend
        run: cargo build --locked --release -p kor-cli
      - working-directory: frontend
        run: npm ci && npm run build:ui && npx tauri build --no-bundle
      # WebKitGTK's bubblewrap sandbox needs unprivileged user namespaces (blocked by AppArmor on 24.04).
      - if: runner.os == 'Linux'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: kor bench --ui --cli --memory
        working-directory: .
        run: |
          weak=()
          wrap=()
          # Weak worker (§32.3): 2 cores, 4 GB, budgets relaxed by the weak factor.
          if [ "${{ matrix.worker }}" = weak ]; then
            weak=(--weak)
            wrap=(sudo systemd-run --scope --quiet -p AllowedCPUs=0-1 -p MemoryMax=4G --uid="$(id -u)" --gid="$(id -g)" --setenv=HOME="$HOME" --setenv=PATH="$PATH")
          fi
          "${wrap[@]}" xvfb-run -a backend/target/release/kor bench --ui --cli --memory "${weak[@]}"             --desktop frontend/src-tauri/target/release/kor-desktop --check

  # §16.4 / §17.2 E2E matrix (ADR 0061): IPC schema, CLI snapshots (insta), PTY-driven REPL and TUI
  # (ConPTY on Windows), TUI test backend over real core events, every scenario of tests/e2e/scenarios
  # on CLI and TUI with the mock provider, `kor doctor --ipc-trace`.
  e2e-cli:
    name: e2e cli+tui (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: backend
    env:
      INSTA_UPDATE: "no"
      CI: "true"
    steps:
      # Byte-exact checkout as in the repo (generated files and scanners expect it).
      - if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
        # Before checkout the job's default working directory does not exist yet.
        working-directory: .
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
      - if: runner.os == 'Linux'
        run: bash ../scripts/ci-linux-deps.sh
      - run: git config --global user.name "Kor CI" && git config --global user.email ci@kor.invalid
      - name: IPC schema and validator
        run: cargo test --locked -p kor-core ipc
      - name: Rust wire shapes against the schema
        run: cargo test --locked -p kor-agent --test ipc_schema
      - name: Scenario model, mock provider, checker
        run: cargo test --locked -p kor-runtime --lib e2e
      - name: CLI snapshots (banner, spinner truecolor/256/NO_COLOR, verb cycle) and TUI panels from core events
        run: cargo test --locked -p kor-cli --bins
      - name: PTY REPL / TUI, scenarios on CLI and TUI, --json snapshots
        run: cargo test --locked -p kor-cli --test e2e -- --test-threads=1
      - name: kor doctor --ipc-trace
        shell: bash
        run: KOR_IPC_TRACE="$RUNNER_TEMP/ipc-trace.ndjson" cargo run --locked -p kor-cli -- --lang en doctor
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-cli-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/ipc-trace.ndjson
            backend/apps/kor-cli/src/snapshots/*.snap.new
            backend/apps/kor-cli/tests/snapshots/*.snap.new
          if-no-files-found: ignore

  # KorThinking states / reduced motion / dark-light, from assets/ in Playwright's Chromium on three OS.
  # Baselines live in frontend/e2e/__screenshots__/brand/<platform>; a platform without one gets it
  # written (artifact) on its first run.
  e2e-brand:
    name: e2e brand visuals (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: frontend
    steps:
      # Byte-exact checkout as in the repo (generated files and scanners expect it).
      - if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
        # Before checkout the job's default working directory does not exist yet.
        working-directory: .
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test -c e2e/playwright.config.ts --project brand --update-snapshots=missing
      # §16.4 macOS: WKWebView cannot be automated; the brand visuals in WebKit are the closest engine.
      - if: runner.os == 'macOS'
        run: npx playwright install webkit
      - if: runner.os == 'macOS'
        run: npx playwright test -c e2e/playwright.config.ts --project brand-webkit --update-snapshots=missing
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-brand-${{ matrix.os }}
          path: |
            frontend/e2e/__screenshots__
            frontend/test-results
            reports
          if-no-files-found: ignore

  # The desktop surface: every scenario against the real app and core (same checker as CLI/TUI), every
  # panel's screenshot. Windows: Playwright over WebView2 CDP; Linux: tauri-driver (WebDriver) under
  # Xvfb. macOS has no WebDriver for WKWebView (tauri-driver does not support it).
  e2e-desktop:
    name: e2e desktop (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # Byte-exact checkout as in the repo (generated files and scanners expect it).
      - if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
        # Before checkout the job's default working directory does not exist yet.
        working-directory: .
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            backend
            frontend/src-tauri
      - if: runner.os == 'Linux'
        run: bash scripts/ci-linux-deps.sh
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: git config --global user.name "Kor CI" && git config --global user.email ci@kor.invalid
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf webkitgtk-webdriver xvfb
      - if: runner.os == 'Linux'
        run: cargo install tauri-driver --locked
      - working-directory: backend
        run: cargo build --locked -p kor-cli && cargo build --locked -p kor-runtime --example mock_provider
      - working-directory: frontend
        run: npm ci && npm run build:ui
      - working-directory: frontend/src-tauri
        run: cargo build
      # The app embeds the WebView2 bootstrapper: without the runtime it waits on the installer and
      # never opens its debugging port. Server images do not always carry the runtime.
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $keys = 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}',
                  'HKLM:\SOFTWARE\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
          $found = $keys | Where-Object { Test-Path $_ } | Select-Object -First 1
          if ($found) { "WebView2 runtime $((Get-ItemProperty $found).pv)" } else {
            Invoke-WebRequest 'https://go.microsoft.com/fwlink/p/?LinkId=2124703' -OutFile "$env:RUNNER_TEMP\wv2.exe"
            Start-Process "$env:RUNNER_TEMP\wv2.exe" -ArgumentList '/silent','/install' -Wait
            'WebView2 runtime installed'
          }
      - if: runner.os == 'Windows'
        working-directory: frontend
        run: npx playwright test -c e2e/playwright.config.ts --project desktop --update-snapshots=missing
      # §17.3: the UI audit is a gate (no open findings, no overflow or console errors on any screen).
      - if: runner.os == 'Windows'
        working-directory: frontend
        run: npx playwright test -c e2e/playwright.config.ts --project audit
      - if: runner.os == 'Windows'
        working-directory: frontend
        run: npm run build:extension && npx playwright install chromium
      # §16.4 fourth surface: the side panel paired with the real desktop app (Windows: Credential
      # Manager holds the pairing; Linux runners have no keychain service).
      - if: runner.os == 'Windows'
        working-directory: frontend
        env:
          KOR_E2E_SIDEPANEL: "1"
        run: npx playwright test -c e2e/playwright.config.ts --project sidepanel
      # WebKitGTK's bubblewrap sandbox needs unprivileged user namespaces (blocked by AppArmor on 24.04).
      - if: runner.os == 'Linux'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - if: runner.os == 'Linux'
        working-directory: frontend
        env:
          KOR_E2E_DRIVER: webdriver
          RUST_BACKTRACE: "1"
        # tauri-driver starts the app, so it must run inside the virtual display too.
        run: |
          xvfb-run -a sh -c 'tauri-driver --port 4444 & npx playwright test -c e2e/playwright.config.ts --project desktop'
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-desktop-${{ matrix.os }}
          path: |
            frontend/test-results
            reports
            frontend/e2e/__screenshots__
          if-no-files-found: ignore
