# §17.2 "sağlayıcı değiştirme": the default model changes between two tasks; the provider is asked for
# the new one. CLI and TUI only: a desktop chat keeps the model it started with (the default applies to
# new chats; the chat's own picker switches it). The normalized stream keeps one status and joins the
# turns' text, so the switch itself is checked by `models`.
name: provider-switch
surfaces: [cli, tui]
title: "Sağlayıcı / model değiştirme"
project:
  files:
    README.md: "# Demo\n"
mock:
  - text: "Birinci model."
    usage: { prompt: 300, completion: 3 }
  - text: "İkinci model."
    usage: { prompt: 300, completion: 3 }
steps:
  - prompt: "selam"
  - command: "kor config set"
    args: ["agent.model", "mock/kor-mock-large"]
    desktop_args: ["agent.model", "mock/kor-mock-large"]
  - prompt: "tekrar selam"
expect:
  events:
    - status
    - { type: text, text: "Birinci model.İkinci model." }
  models: ["kor-mock", "kor-mock-large"]
  usage_requests: 2
