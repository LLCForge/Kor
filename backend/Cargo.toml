[workspace]
resolver = "3"
members = ["crates/*", "apps/*", "crates/kor-platform/shellext"]

[workspace.package]
version = "0.8.11"
edition = "2024"
rust-version = "1.89"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/LLCForge/Kor"
authors = ["Kor contributors"]

[workspace.dependencies]
kor-core = { path = "crates/kor-core", version = "0.2.8" }
kor-config = { path = "crates/kor-config", version = "0.6.4" }
kor-secrets = { path = "crates/kor-secrets", version = "0.2.2" }
kor-i18n = { path = "crates/kor-i18n", version = "0.1.13" }
kor-providers = { path = "crates/kor-providers", version = "0.2.8" }
kor-sandbox = { path = "crates/kor-sandbox", version = "0.2.4" }
kor-tools = { path = "crates/kor-tools", version = "0.2.6" }
kor-agent = { path = "crates/kor-agent", version = "0.6.8" }
kor-compat = { path = "crates/kor-compat", version = "0.2.3" }
kor-runtime = { path = "crates/kor-runtime", version = "0.6.9" }
kor-platform = { path = "crates/kor-platform", version = "0.1.7" }
kor-components = { path = "crates/kor-components", version = "0.1.2" }
kor-proxy = { path = "crates/kor-proxy", version = "0.0.7" }
kor-graph = { path = "crates/kor-graph", version = "0.4.4" }
kor-memory = { path = "crates/kor-memory", version = "0.2.2" }
kor-web = { path = "crates/kor-web", version = "0.0.4" }
kor-computer = { path = "crates/kor-computer", version = "0.0.4", default-features = false }
kor-health = { path = "crates/kor-health", version = "0.0.3" }

anyhow = "1"
async-trait = "0.1"
futures = "0.3"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "stream", "http2"] }
# kor-proxy's HTTP server (already in the tree through reqwest/wiremock; ADR 00NN-kor-proxy).
bytes = "1"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
serde_yaml = "0.9"
getrandom = "0.4"
subtle = "2"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "time", "signal", "sync", "process", "io-util", "fs", "net"] }
tokio-util = "0.7"
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect"] }
wiremock = "0.6"
clap = { version = "4", features = ["derive", "env"] }
dirs = "7"
keyring = "4"
fluent-bundle = "0.16"
globset = "0.4"
ignore = "0.4"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
enigo = "0.6"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
xcap = "0.9"
ratatui = "0.29"
crossterm = "0.28"
regex = "1"
rusqlite = { version = "0.41", features = ["bundled"] }
rpassword = "7"
sha2 = "0.10"
# RSA signing for cloud identities (Vertex service accounts, OCI); already in the tree via rustls.
ring = "0.17"
secrecy = "0.10"
# Encrypted local vault fallback (ADR 0036): RustCrypto, audited AEAD + password KDF.
argon2 = "0.5"
chacha20poly1305 = "0.10"
zeroize = "1"
# Cross-process lock for audit.jsonl appends (kor-platform only; ADR 0036).
fslock = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
minisign-verify = "0.3"
sys-locale = "0.3"
tempfile = "3"
thiserror = "2"
toml = "1"
toml_edit = "0.25"
unic-langid = "0.9"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
must_use_candidate = "allow"

# §32.2 (ADR 0062): fat LTO, one codegen unit, abort on panic. Nothing in the workspace relies on
# unwinding (no catch_unwind; kor-lint and tests run in the dev/test profiles, which always unwind).
[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
