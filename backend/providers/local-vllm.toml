# Default port per https://docs.vllm.ai/en/latest/serving/openai_compatible_server.html
id = "local-vllm"
name = "Local (vLLM)"
category = "local"
adapter = "openai_compat"
base_url = "http://localhost:8000/v1"
auth = { kind = "none" }
models_endpoint = "/models"
tool_calling = true
verified = false
docs = "https://docs.vllm.ai/en/latest/serving/openai_compatible_server.html"

[privacy]
tier = "local"
retention = "Never leaves this machine."
training_on_data = false
