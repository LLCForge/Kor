]

[[provider]]
id = "cohere"
training = "opt-out"
retention_days = 30
zdr = "required"
sources = [
  { url = "https://cohere.com/data-usage-policy", retrieved = "2026-11-10", quote = "We automatically delete logged prompts and generations after 30 days." },
