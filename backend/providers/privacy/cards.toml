[[provider]]
id = "venice"
notes = ["The cited page covers the consumer app's Private mode; API terms were not stated there."]
sources = [
  { url = "https://venice.ai/privacy", retrieved = "2026-11-10", quote = "no prompt or response is stored" },
]
