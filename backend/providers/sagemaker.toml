# Amazon SageMaker runtime: an endpoint serving an OpenAI-compatible container (vLLM, LMI, TGI).
# Signed with SigV4 from AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY (or ~/.aws/credentials); the
# endpoint name is the model id. Without SAGEMAKER_RUNTIME_URL the region comes from AWS_REGION.
id = "sagemaker"
name = "Amazon SageMaker"
category = "cloud"
adapter = "sagemaker"
base_url = "https://runtime.sagemaker.your-region.invalid"
base_url_env = "SAGEMAKER_RUNTIME_URL"
auth = { kind = "none" }
tool_calling = true
verified = false
docs = "https://docs.aws.amazon.com/sagemaker/latest/APIReference/API_runtime_InvokeEndpoint.html"

[privacy]
tier = "no_train"
retention = "Your own endpoint in your AWS account."
jurisdiction = "per region"
