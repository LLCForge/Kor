# Source: https://openrouter.ai/docs/api-reference/overview
id = "openrouter"
name = "OpenRouter"
category = "aggregator"
adapter = "openai_compat"
base_url = "https://openrouter.ai/api/v1"
auth = { kind = "bearer", env = "OPENROUTER_API_KEY" }
models_endpoint = "/models"
tool_calling = true
verified = false
docs = "https://openrouter.ai/docs/api-reference/overview"
# Public model list and pricing: GET /models (no key). Per-call stats: GET /generation?id=<id>.
vision = true
json_mode = true
thinking = true
[quirks]
extra_headers = { "X-Title" = "Kor" }
# Usage accounting: the final chunk carries `usage.cost` (USD), recorded by `kor cost`.
extra_body = { usage = { include = true } }
[privacy]
tier = "standard"
retention = "Depends on the routed provider; OpenRouter itself does not log prompts unless opted in (verify)."
jurisdiction = "US"
