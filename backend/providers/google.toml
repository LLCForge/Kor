id = "google"
name = "Google AI (Gemini API)"
category = "standard"
adapter = "gemini"
base_url = "https://generativelanguage.googleapis.com/v1beta"
auth = { kind = "header", env = "GEMINI_API_KEY", header = "x-goog-api-key" }
models_endpoint = "/models"
tool_calling = true
vision = true
json_mode = true
thinking = true
verified = false
docs = "https://ai.google.dev/api/generate-content"

[privacy]
# Free-tier data may be used to improve products; paid tier is not. Tier reflects the weaker case.
tier = "standard"
retention = "Depends on billing tier (verify)."
jurisdiction = "US"
policy_url = "https://ai.google.dev/gemini-api/terms"
