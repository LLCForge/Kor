# Source: https://docs.api.nvidia.com/nim/reference/llm-apis
id = "nvidia"
name = "NVIDIA NIM (build.nvidia.com)"
category = "standard"
adapter = "openai_compat"
base_url = "https://integrate.api.nvidia.com/v1"
auth = { kind = "bearer", env = "NVIDIA_API_KEY" }
models_endpoint = "/models"
tool_calling = true
verified = false
docs = "https://docs.api.nvidia.com/nim/reference/llm-apis"

[privacy]
tier = "standard"
retention = "Hosted trial API; retention per NVIDIA terms (verify). Self-hosted NIM: add as a custom endpoint."
jurisdiction = "US"
