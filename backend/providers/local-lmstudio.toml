# Default port per https://lmstudio.ai/docs/app/api/endpoints/openai
id = "local-lmstudio"
name = "Local (LM Studio)"
category = "local"
adapter = "openai_compat"
base_url = "http://localhost:1234/v1"
auth = { kind = "none" }
