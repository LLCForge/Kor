[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.34.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "powershell"]
# Target platforms to build apps for (Rust target-triple syntax)
# The static musl and Windows ARM64 CLIs leave out screen capture (musl: no PipeWire/Wayland) and
# `kor proxy` (BoringSSL); both say "not available in this build" (kor-cli build.rs, kor-computer).
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-gnu", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-unknown-linux-musl", "x86_64-pc-windows-msvc", "aarch64-pc-windows-msvc"]
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Whether to install an updater program
install-updater = false
# Sigstore provenance for every artifact (`gh attestation verify`)
github-attestations = true
# The generated workflow is adapted: the Cargo workspace lives in backend/ and releases also carry
# minisign-signed raw binaries for `kor update` (see .github/workflows/release.yml at the repo root).
allow-dirty = ["ci"]

# Linux builds run on Ubuntu 24.04: libspa (screen capture) needs PipeWire 1.0 headers, 22.04 ships 0.3.
# The binaries then need glibc 2.39+ (Ubuntu 24.04, Debian 13, Fedora 40 or newer).
[dist.github-custom-runners]
x86_64-unknown-linux-gnu = "ubuntu-24.04"
aarch64-unknown-linux-gnu = "ubuntu-24.04-arm"
# Apple Silicon runners sat in GitHub's queue for hours; the Intel runner cross-compiles arm64.
aarch64-apple-darwin = "macos-15-intel"
# Native ARM64 Windows runner: the build runs (and its PGO training run) on the target itself.
aarch64-pc-windows-msvc = "windows-11-arm"

# System libraries the Linux build links (screen capture: Wayland, GBM/DRM, PipeWire via bindgen; D-Bus).
[dist.dependencies.apt]
pkg-config = "*"
libwayland-dev = "*"
libgbm-dev = "*"
libdrm-dev = "*"
"libpipewire-0.3-dev" = "*"
"libspa-0.2-dev" = "*"
libclang-dev = "*"
clang = "*"
libdbus-1-dev = "*"
libegl-dev = "*"
