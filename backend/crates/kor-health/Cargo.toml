[package]
name = "kor-health"
description = "Local system profile, health alerts and cache cleanup for the Kor coding agent (spec §19.2, §19.3)"
version = "0.0.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
dirs.workspace = true
kor-computer = { workspace = true, features = ["live"] }
kor-config.workspace = true
kor-i18n.workspace = true
kor-platform.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
# CPU, memory, disks, network, processes and temperatures without OS branches.
sysinfo = { version = "0.37", default-features = false, features = ["system", "disk", "network", "component"] }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
