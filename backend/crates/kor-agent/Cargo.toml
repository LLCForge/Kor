[package]
name = "kor-agent"
description = "Agent loop, permissions and sessions for the Kor coding agent"
version = "0.6.8"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
async-trait.workspace = true
base64.workspace = true
chrono.workspace = true
# MCP-call hooks find the configured servers (ADR 0063).
dirs.workspace = true
futures.workspace = true
globset.workspace = true
ignore.workspace = true
kor-compat.workspace = true
kor-core.workspace = true
kor-graph.workspace = true
# §19.3: writes stop up front on a critically full disk (ADR 0059).
kor-health.workspace = true
kor-memory.workspace = true
kor-providers.workspace = true
kor-secrets.workspace = true
kor-tools.workspace = true
kor-sandbox.workspace = true
kor-platform.workspace = true
regex.workspace = true
rusqlite.workspace = true
reqwest.workspace = true
serde.workspace = true
sha2.workspace = true
serde_json.workspace = true
# OpenAPI documents in YAML (`kor mcp add`, ADR 0038).
serde_yaml.workspace = true
thiserror.workspace = true
tokio-util.workspace = true
toml.workspace = true
tokio.workspace = true
# §12.1 WASM plugins (`wasm` feature, the CLI's): no WASI, no disk cache, no parallel compile.
minisign-verify = { workspace = true, optional = true }
wasmtime = { version = "47", default-features = false, features = ["runtime", "cranelift", "std", "wat"], optional = true }
wat = { version = "1", optional = true }

[features]
wasm = ["dep:wasmtime", "dep:wat", "dep:minisign-verify"]

[dev-dependencies]
# Signs test plugins with a key made per run (ADR 0045's crate).
minisign = "0.7"
tempfile.workspace = true
tokio.workspace = true
wiremock.workspace = true

[lints]
workspace = true
