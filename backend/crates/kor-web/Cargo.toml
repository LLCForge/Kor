[package]
name = "kor-web"
description = "Kor's webmaster and agency module: hosting panels, WordPress, technical SEO (spec §29)"
version = "0.0.4"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
kor-core.workspace = true
serde.workspace = true
serde_json.workspace = true
# seo (K6, ADR 0055): crawler, Google APIs, content/meta pipeline, logs, competitors, agents.
async-trait.workspace = true
base64.workspace = true
chrono.workspace = true
dns-lookup = "2"
flate2 = "1"
futures.workspace = true
getrandom.workspace = true
kor-agent.workspace = true
kor-providers.workspace = true
kor-runtime.workspace = true
kor-secrets.workspace = true
kor-tools.workspace = true
percent-encoding = "2"
regex.workspace = true
reqwest.workspace = true
rusqlite.workspace = true
sha2.workspace = true
tokio.workspace = true
toml.workspace = true
url = "2"
# site (K5, ADR 0054): vault config, TLS certificate expiry probe, DOCX output.
kor-config.workspace = true
kor-i18n.workspace = true
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std"] }
tokio-rustls = { version = "0.26", default-features = false }
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }

[dev-dependencies]
tempfile.workspace = true
wiremock.workspace = true

[lints]
workspace = true
