[package]
name = "kor-runtime"
description = "Shared agent session assembly for the Kor CLI and desktop app"
version = "0.6.7"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
async-trait.workspace = true
futures.workspace = true
ignore.workspace = true
chrono.workspace = true
dirs.workspace = true
kor-agent.workspace = true
kor-compat.workspace = true
# §19 desktop tiers / audit / indicator and system profile / health (ADR 0059).
kor-computer.workspace = true
kor-health.workspace = true
kor-components.workspace = true
kor-config.workspace = true
kor-core.workspace = true
kor-i18n.workspace = true
kor-providers.workspace = true
kor-sandbox.workspace = true
kor-secrets.workspace = true
kor-tools.workspace = true
kor-platform.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
minisign-verify.workspace = true
# `kor audit --sign` (ADR 0045): optional minisign signature of analysis reports.
minisign = "0.7"
sha2.workspace = true
reqwest.workspace = true
# `kor acp` / `kor peer serve --stdio` speak on stdin/stdout (ADR 0057).
tokio = { workspace = true, features = ["io-std"] }
toml.workspace = true
# `kor deploy` / `kor watch` / `kor db` extensions (ADR 0041): compose files, graph risk checks.
kor-graph.workspace = true
# `kor perf` (ADR 0049): gzip pprof / samply profiles.
flate2 = "1"
serde_yaml.workspace = true
tokio-util.workspace = true
# `kor daemon` (ADR 0039): webhook listener, HMAC, log_match, SMTP over TLS, trigger edits.
base64.workspace = true
bytes.workspace = true
getrandom.workspace = true
hmac = "0.12"
http-body-util.workspace = true
hyper.workspace = true
hyper-util.workspace = true
regex.workspace = true
rustls-platform-verifier = "0.7"
subtle.workspace = true
tokio-rustls = { version = "0.26", default-features = false }
toml_edit.workspace = true
# Code metrics (`kor quality|debt|style|explain|dead-code`, ADR 0047): same grammar version as kor-graph.
globset.workspace = true
kor-memory.workspace = true
# Session tree errors (ADR 0050).
thiserror.workspace = true
tree-sitter = "0.25"
# Visual input (`kor screenshot|diagram`, ADR 0048): image size and dominant colours for the OCR fallback;
# arboard reads a pasted image from the clipboard (Win32 / AppKit / X11 in pure Rust, no system libs).
image = { workspace = true, features = ["webp", "gif", "bmp", "tiff"] }
arboard = { version = "3", default-features = false, features = ["image-data"] }
# `~/Kor/` watcher and batch file edits (ADR 0052): encoding fix, PDF merge.
notify = "8"
encoding_rs = "0.8"
lopdf = { version = "0.47", default-features = false }
# `kor docs add` (ADR 0063): text of DOCX files (same zip build as kor-components).
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }

# Kor-to-Kor bridge (ADR 0057): Noise XX / XXpsk3 sessions between paired peers, pairing QR codes.
snow = "0.9"
qrcode = { version = "0.14", default-features = false }

[dev-dependencies]
futures.workspace = true
tempfile.workspace = true
wiremock.workspace = true

[lints]
workspace = true
